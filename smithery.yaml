# Smithery registry manifest for @costrinity/vitna-compliance-mcp
# Docs: https://smithery.ai/docs/build/project-config
#
# Listing description (the npm description):
# A containment layer for AI agents that go rogue. Wraps stdio MCP servers:
# risky tool calls wait for a person, no API key can decide a hold (not even
# the agent's), and claimed accounts get signed, offline-verifiable records.
# Covers the servers you wrap.
startCommand:
  type: stdio
  configSchema:
    type: object
    # No required fields: with no credentials, the first tool call self-provisions
    # a restricted trial key. Claim the account with GitHub or a passkey. The claim
    # link is printed in your MCP server log, never sent to the agent;
    # VITNA_OPEN_CLAIM=1 opens it in your browser.
    properties:
      vitnaOwnerId:
        type: string
        description: "Optional. Your VITNA owner ID. If unset, a trial key is self-provisioned on first use."
      vitnaApiKey:
        type: string
        description: "Optional. Your VITNA API key (vitna_..., or a legacy vigil_... key). Self-provisioned if unset."
      vitnaBaseUrl:
        type: string
        default: "https://vitna.costrinity.xyz"
        description: "VITNA base URL. Override only for self-hosted."
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['@costrinity/vitna-compliance-mcp'],
      env: {
        VITNA_OWNER_ID: config.vitnaOwnerId || '',
        VITNA_API_KEY: config.vitnaApiKey || '',
        VITNA_BASE_URL: config.vitnaBaseUrl || 'https://vitna.costrinity.xyz'
      }
    })
